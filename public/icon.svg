@font-face {
  font-family: 'Inter';
  src: local('Inter'), local('Arial'), sans-serif;
  font-display: swap;
}

:root {
  --bg: #0d0d0f;
  --panel: rgba(15, 15, 18, 0.8);
  --surface: rgba(255, 255, 255, 0.04);
  --surface-soft: rgba(255, 255, 255, 0.02);
  --line: rgba(255, 255, 255, 0.14);
  --line-soft: rgba(255, 255, 255, 0.08);
  --text: #f3f3f3;
  --muted: rgba(243, 243, 243, 0.72);
  --dim: rgba(130, 130, 130, 0.5);
  --shadow: rgba(0, 0, 0, 0.5);
  --glow: rgba(255, 255, 255, 0.12);
  --nav-size: 3.4rem;
  --content-padding: clamp(1rem, 1vw, 1.5rem);
  font-family: 'Inter', sans-serif;
  color: var(--text);
  background: var(--bg);
}

html, body, #root {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
}

body {
  min-height: 100vh;
  overscroll-behavior: none;
  background:
    radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.06), transparent 26%),
    radial-gradient(circle at 80% 30%, rgba(255, 255, 255, 0.04), transparent 28%),
    linear-gradient(180deg, #0b0b0d 0%, #121316 100%);
  color: var(--text);
}

button {
  font: inherit;
}

.app-shell {
  position: relative;
  display: flex;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: rgba(7, 7, 9, 0.8);
  isolation: isolate;
}

.scene-stage {
  position: relative;
  width: 100%;
  height: 100%;
  padding: clamp(1rem, 2vw, 1.5rem);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  filter: blur(0px);
  background: linear-gradient(180deg, rgba(18, 18, 22, 0.5) 0%, rgba(7, 7, 9, 0.9) 100%);
}

.noise-layer {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.02)),
    linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
    linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px);
  background-size: auto, 22px 22px, 22px 22px;
  opacity: 0.35;
  pointer-events: none;
}

.top-bar,
.hero-copy,
.animation-window,
.nav-shell {
  position: relative;
  z-index: 2;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  width: 100%;
}

.label-group {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex-wrap: wrap;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  padding: 0.35rem 0.72rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.02);
  color: var(--text);
  font-size: 0.65rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  white-space: nowrap;
}

.eyebrow.soft {
  background: transparent;
  color: rgba(255, 255, 255, 0.5);
  letter-spacing: 0.12em;
}

.counter {
  color: rgba(255, 255, 255, 0.68);
  font-size: 0.72rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.hero-copy {
  position: absolute;
  left: clamp(1rem, 3vw, 2rem);
  top: clamp(4.2rem, 14vw, 7rem);
  width: min(28rem, 58vw);
  pointer-events: none;
}

.kicker {
  margin: 0 0 0.5rem;
  color: rgba(255, 255, 255, 0.58);
  letter-spacing: 0.2em;
  font-size: 0.64rem;
  text-transform: uppercase;
}

.hero-copy h1 {
  margin: 0;
  font-size: clamp(2.2rem, 7vw, 6rem);
  line-height: 0.9;
  letter-spacing: -0.08em;
  font-weight: 600;
  text-transform: uppercase;
}

.description {
  margin: 0.8rem 0 0;
  max-width: 24rem;
  color: rgba(255, 255, 255, 0.72);
  font-size: clamp(0.8rem, 2vw, 1rem);
  line-height: 1.6;
}

.animation-window {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
}

.scene {
  position: relative;
  width: min(80vw, 78vh);
  height: min(72vw, 78vh);
  max-width: 54rem;
  max-height: 54rem;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 2rem;
  background: radial-gradient(circle at center, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01) 65%, transparent 100%);
  box-shadow: inset 0 0 50px rgba(255, 255, 255, 0.03), 0 30px 70px rgba(0, 0, 0, 0.5);
  overflow: hidden;
  margin-left: auto;
  margin-right: clamp(1rem, 4vw, 4rem);
  margin-top: clamp(8rem, 18vh, 12rem);
}

.scene > * {
  position: absolute;
}

.nav-shell {
  position: absolute;
  right: clamp(1rem, 3vw, 2rem);
  bottom: clamp(1rem, 3vw, 2rem);
  display: flex;
  gap: 0.8rem;
  z-index: 10;
}

.nav-button {
  width: var(--nav-size);
  height: var(--nav-size);
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: rgba(12, 12, 14, 0.7);
  color: var(--text);
  box-shadow: 0 12px 26px rgba(0, 0, 0, 0.34), inset 0 0 18px rgba(255, 255, 255, 0.03);
  cursor: pointer;
  transition: transform 200ms ease, border-color 200ms ease, box-shadow 200ms ease;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.nav-button:active {
  transform: scale(0.96);
}

.nav-button span {
  font-size: clamp(1.5rem, 3vw, 2rem);
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.nav-button:hover {
  border-color: rgba(255, 255, 255, 0.25);
  box-shadow: 0 16px 28px rgba(0, 0, 0, 0.38), inset 0 0 20px rgba(255, 255, 255, 0.02);
}

.orb-pulse .orb,
.orbit-ring .orbit-core,
.orbit-ring .orbit-dot,
.ripple-stack .ripple,
.ring-collapse .ring-shell,
.focus-pulse .focus-wave,
.conic-spin .cone,
.conic-spin .cone-ring,
.mirage-bloom .mirage,
.depth-blocks .depth-box,
.night-current .current-line,
.grid-sweep .sweep-bar,
.magnet-mesh .node,
.magnet-mesh .mesh-ring,
.thread-lace .lace,
.slicer-sweep .slice,
.monolith-rise .block,
.stagger-bars .bar,
.static-motes .mote,
.signal-noise .signal-bar,
.vapor-bands .vapor-band,
.ribbon-wave .ribbon,
.glass-lattice .cell,
.hex-field .hex,
.stripe-flow .stripe,
.split-rows .row-line,
.arc-rain .arc,
.tunnel-vortex .tunnel-ring,
.sine-columns .column,
.capsule-drift .capsule,
.row-line,
.mote,
.node,
.slice,
.bar,
.column,
.arc,
.block,
.vapor-band,
.signal-bar,
.ribbon,
.cell,
.hex,
.stripe,
.current-line,
.depth-box,
.lace,
.ring-shell,
.focus-wave,
.cone,
.cone-ring {
  display: block;
  position: absolute;
}

.orb-pulse .orb {
  width: 16rem;
  height: 16rem;
  border-radius: 50%;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.8), rgba(255,255,255,0.2) 30%, rgba(255,255,255,0.05) 55%, transparent 72%);
  filter: blur(2px);
  animation: floatOrb 6s ease-in-out infinite alternate;
}

.orb-pulse .orb-1 { width: 10rem; height: 10rem; opacity: 0.7; }
.orb-pulse .orb-2 { width: 14rem; height: 14rem; animation-delay: 0.6s; opacity: 0.6; }
.orb-pulse .orb-3 { width: 18rem; height: 18rem; animation-delay: 1.2s; opacity: 0.45; }
.orb-pulse .ring {
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 50%;
  inset: 12%;
  animation: orbRing 7s ease-in-out infinite alternate;
}
.orb-pulse .ring-2 { inset: 22%; animation-delay: 0.8s; }

@keyframes floatOrb {
  0% { transform: translate(-50%, -50%) scale(0.92); }
  100% { transform: translate(-50%, -50%) scale(1.12); }
}
@keyframes orbRing {
  0% { transform: scale(0.92); opacity: 0.2; }
  100% { transform: scale(1.08); opacity: 0.6; }
}

.ribbon-wave .ribbon {
  left: 8%;
  right: 8%;
  height: 18%;
  border-radius: 999px;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.9) 18%, rgba(255,255,255,0.18) 58%, transparent 100%);
  filter: blur(2px);
  animation: ribbonDrift 7s ease-in-out infinite;
}
.ribbon-wave .ribbon-1 { top: 22%; transform: rotate(10deg) scaleX(0.9); }
.ribbon-wave .ribbon-2 { top: 38%; transform: rotate(-14deg) scaleX(0.96); animation-delay: 0.5s; }
.ribbon-wave .ribbon-3 { top: 54%; transform: rotate(9deg) scaleX(1.08); animation-delay: 1s; }
.ribbon-wave .ribbon-4 { top: 70%; transform: rotate(-11deg) scaleX(0.82); animation-delay: 1.5s; }

@keyframes ribbonDrift {
  0%, 100% { transform: translateX(-5%) scaleX(0.86) rotate(6deg); opacity: 0.35; }
  50% { transform: translateX(5%) scaleX(1.12) rotate(-10deg); opacity: 0.8; }
}

.grid-sweep {
  background: radial-gradient(circle at center, rgba(255,255,255,0.04), transparent 60%);
}
.grid-sweep .grid-lines {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 0.25rem;
  padding: 1.4rem;
}
.grid-sweep .grid-line {
  width: 100%;
  height: 100%;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 0.7rem;
  background: rgba(255,255,255,0.02);
  animation: gridPulse 8s ease-in-out infinite;
}
.grid-sweep .sweep-bar {
  left: -20%;
  right: -20%;
  top: 50%;
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.5) 24%, rgba(255,255,255,1) 50%, rgba(255,255,255,0.5) 76%, transparent 100%);
  box-shadow: 0 0 18px rgba(255,255,255,0.38);
  animation: sweep 5s ease-in-out infinite;
}

@keyframes gridPulse {
  0%, 100% { opacity: 0.18; transform: scaleY(0.9); }
  50% { opacity: 0.8; transform: scaleY(1.04); }
}
@keyframes sweep {
  0% { transform: translateX(-30%) rotate(22deg); opacity: 0; }
  30% { opacity: 0.8; }
  100% { transform: translateX(30%) rotate(-22deg); opacity: 0; }
}

.type-drift .text-stack {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: clamp(2.4rem, 6vw, 6rem);
  letter-spacing: -0.12em;
  font-weight: 700;
  text-transform: uppercase;
  line-height: 0.85;
}
.type-drift .text-stack span {
  display: block;
  transform: translateY(0);
  animation: textDrift 5s ease-in-out infinite alternate;
  opacity: 0.7;
}
.type-drift .text-stack span:nth-child(2) { animation-delay: 0.4s; }
.type-drift .text-stack span:nth-child(3) { animation-delay: 0.8s; }

@keyframes textDrift {
  0% { transform: translateY(0); filter: blur(0); opacity: 0.5; }
  50% { transform: translateY(-12px); filter: blur(0.2px); opacity: 0.9; }
  100% { transform: translateY(12px); filter: blur(0.8px); opacity: 0.6; }
}

.signal-noise .signal-bar {
  width: 0.4rem;
  height: 100%;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.24) 100%);
  box-shadow: 0 0 18px rgba(255,255,255,0.18);
  animation: signalRise 4s ease-in-out infinite;
}
.signal-noise {
  display: flex;
  align-items: end;
  justify-content: center;
  gap: 0.16rem;
  padding: 1.5rem;
}

@keyframes signalRise {
  0%, 100% { height: 22%; opacity: 0.3; }
  50% { height: 90%; opacity: 0.95; }
}

.orbit-ring {
  background: radial-gradient(circle at center, rgba(255,255,255,0.04), transparent 60%);
}
.orbit-ring .orbit-core {
  inset: 50% auto auto 50%;
  width: 4rem;
  height: 4rem;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9), rgba(255,255,255,0.2) 40%, transparent 68%);
  box-shadow: 0 0 18px rgba(255,255,255,0.26);
}
.orbit-ring .orbit-dot {
  width: 0.7rem;
  height: 0.7rem;
  border-radius: 50%;
  background: rgba(255,255,255,0.8);
  top: 50%;
  left: 50%;
  box-shadow: 0 0 18px rgba(255,255,255,0.3);
  animation: orbitDot 5s linear infinite;
}
.orbit-ring .dot-1 { animation-delay: 0s; }
.orbit-ring .dot-2 { animation-delay: 1.2s; }
.orbit-ring .dot-3 { animation-delay: 2.4s; }
.orbit-ring .dot-4 { animation-delay: 3.6s; }

@keyframes orbitDot {
  0% { transform: rotate(0deg) translateX(10.2rem) rotate(0deg); }
  100% { transform: rotate(360deg) translateX(10.2rem) rotate(-360deg); }
}

.glass-lattice {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.65rem;
  padding: 2rem;
}
.glass-lattice .cell {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 0.8rem;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: inset 0 0 25px rgba(255,255,255,0.04);
  animation: cellPulse 5s ease-in-out infinite;
}

@keyframes cellPulse {
  0%, 100% { transform: scale(0.88); opacity: 0.25; }
  50% { transform: scale(1.04); opacity: 0.9; }
}

.morph-bloom .bloom {
  left: 50%;
  top: 50%;
  width: 18rem;
  height: 18rem;
  transform: translate(-50%, -50%);
  border-radius: 42% 58% 62% 38% / 48% 36% 64% 52%;
  background: radial-gradient(circle at center, rgba(255,255,255,0.16), rgba(255,255,255,0.07) 35%, transparent 70%);
  border: 1px solid rgba(255,255,255,0.12);
  filter: blur(2px);
  animation: bloomMorph 8s ease-in-out infinite;
}
.morph-bloom .bloom-2 { width: 13rem; height: 13rem; animation-delay: 0.7s; }
.morph-bloom .bloom-3 { width: 9rem; height: 9rem; animation-delay: 1.4s; }

@keyframes bloomMorph {
  0%, 100% { transform: translate(-50%, -50%) rotate(0deg) scale(0.9); opacity: 0.35; }
  50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.08); opacity: 0.9; }
}

.beam-search {
  background: radial-gradient(circle at center, rgba(255,255,255,0.04), transparent 65%);
}
.beam-search .beam {
  width: 0.8rem;
  height: 100%;
  left: 50%;
  top: 0;
  transform: translateX(-50%) rotate(0deg);
  background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,0.8), rgba(255,255,255,0));
  box-shadow: 0 0 18px rgba(255,255,255,0.28);
  animation: beamScan 4s ease-in-out infinite;
}
.beam-search .beam-2 { animation-delay: 0.5s; }
.beam-search .beam-3 { animation-delay: 1s; }
.beam-search .beam-4 { animation-delay: 1.5s; }

@keyframes beamScan {
  0% { transform: translateX(-50%) rotate(-18deg) scaleY(0.2); opacity: 0.2; }
  50% { transform: translateX(-50%) rotate(18deg) scaleY(1); opacity: 0.95; }
  100% { transform: translateX(-50%) rotate(-18deg) scaleY(0.2); opacity: 0.2; }
}

.ripple-stack {
  background: radial-gradient(circle at center, rgba(255,255,255,0.02), transparent 72%);
}
.ripple-stack .ripple {
  left: 50%;
  top: 50%;
  width: 14rem;
  height: 14rem;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(0.2);
  animation: ripplePulse 5s ease-out infinite;
}
.ripple-stack .ripple-2 { animation-delay: 0.5s; }
.ripple-stack .ripple-3 { animation-delay: 1s; }
.ripple-stack .ripple-4 { animation-delay: 1.5s; }
.ripple-stack .ripple-5 { animation-delay: 2s; }

@keyframes ripplePulse {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.25); }
  20% { opacity: 0.65; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.16); }
}

.vapor-bands {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.7rem;
  padding: 1.8rem;
}
.vapor-bands .vapor-band {
  width: 100%;
  height: 1.6rem;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.25), rgba(255,255,255,0.04));
  filter: blur(2px);
  animation: vaporMove 7s ease-in-out infinite;
}

@keyframes vaporMove {
  0%, 100% { transform: translateX(-8%) scaleX(0.8); opacity: 0.2; }
  50% { transform: translateX(8%) scaleX(1.1); opacity: 0.8; }
}

.hex-field {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 0.7rem;
  padding: 2rem;
}
.hex-field .hex {
  width: 100%;
  aspect-ratio: 1;
  clip-path: polygon(25% 6%, 75% 6%, 100% 50%, 75% 94%, 25% 94%, 0% 50%);
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  animation: hexFloat 6s ease-in-out infinite;
}

@keyframes hexFloat {
  0%, 100% { transform: translateY(0) scale(0.85); opacity: 0.2; }
  50% { transform: translateY(-10px) scale(1.08); opacity: 0.92; }
}

.sine-columns {
  display: flex;
  align-items: end;
  justify-content: center;
  gap: 0.5rem;
  padding: 1.5rem;
}
.sine-columns .column {
  width: 0.7rem;
  height: 42%;
  border-radius: 0.7rem 0.7rem 0 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0.05));
  animation: sineRise 4s ease-in-out infinite;
}

@keyframes sineRise {
  0%, 100% { height: 28%; opacity: 0.25; }
  50% { height: 92%; opacity: 0.9; }
}

.capsule-drift {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  padding: 1rem;
}
.capsule-drift .capsule {
  width: 2.5rem;
  height: 0.8rem;
  border-radius: 999px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.12);
  animation: capsuleMove 8s ease-in-out infinite;
}

@keyframes capsuleMove {
  0%, 100% { transform: translateY(0) scaleX(0.65); opacity: 0.3; }
  50% { transform: translateY(-12px) scaleX(1.12); opacity: 0.9; }
}

.ring-collapse .ring-shell {
  left: 50%;
  top: 50%;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.16);
  transform: translate(-50%, -50%);
  animation: ringCollapse 6s ease-in-out infinite;
}
.ring-collapse .shell-1 { width: 16rem; height: 16rem; }
.ring-collapse .shell-2 { width: 12rem; height: 12rem; animation-delay: 0.4s; }
.ring-collapse .shell-3 { width: 8rem; height: 8rem; animation-delay: 0.8s; }
.ring-collapse .ring-core {
  left: 50%;
  top: 50%;
  width: 3.2rem;
  height: 3.2rem;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.18);
  box-shadow: 0 0 20px rgba(255,255,255,0.28);
}

@keyframes ringCollapse {
  0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.85); }
  50% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.18); }
}

.tunnel-vortex {
  display: grid;
  place-items: center;
}
.tunnel-vortex .tunnel-ring {
  width: 100%;
  height: 100%;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 50%;
  transform: scale(0.55) rotate(0deg);
  animation: tunnelSpin 7s ease-in-out infinite;
}

@keyframes tunnelSpin {
  0%, 100% { opacity: 0.2; transform: scale(0.42) rotate(0deg); }
  50% { opacity: 0.92; transform: scale(1) rotate(160deg); }
}

.stripe-flow {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  padding: 1rem;
}
.stripe-flow .stripe {
  width: 0.65rem;
  height: 100%;
  border-radius: 0.4rem;
  background: linear-gradient(180deg, rgba(255,255,255,0.7), rgba(255,255,255,0.1));
  animation: stripeSlide 5s ease-in-out infinite;
}

@keyframes stripeSlide {
  0%, 100% { transform: translateY(15%) scaleY(0.7); opacity: 0.2; }
  50% { transform: translateY(-15%) scaleY(1.08); opacity: 0.9; }
}

.focus-pulse .focus-wave {
  left: 50%;
  top: 50%;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.12);
  transform: translate(-50%, -50%) scale(0.4);
  animation: focusWave 5s ease-out infinite;
}
.focus-pulse .wave-1 { width: 14rem; height: 14rem; }
.focus-pulse .wave-2 { width: 20rem; height: 20rem; animation-delay: 0.5s; }
.focus-pulse .wave-3 { width: 26rem; height: 26rem; animation-delay: 1s; }
.focus-pulse .wave-4 { width: 32rem; height: 32rem; animation-delay: 1.5s; }
.focus-pulse .focus-center {
  left: 50%;
  top: 50%;
  width: 4rem;
  height: 4rem;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle at center, rgba(255,255,255,0.9), rgba(255,255,255,0.18) 35%, transparent 72%);
  box-shadow: 0 0 18px rgba(255,255,255,0.28);
}

@keyframes focusWave {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
  20% { opacity: 0.7; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); }
}

.arc-rain {
  display: grid;
  place-items: center;
}
.arc-rain .arc {
  width: 11rem;
  height: 4rem;
  border: 1px solid rgba(255,255,255,0.14);
  border-color: rgba(255,255,255,0.14) transparent transparent transparent;
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  transform: rotate(20deg);
  animation: arcFall 6s ease-in-out infinite;
}

@keyframes arcFall {
  0%, 100% { transform: translateY(-10px) rotate(20deg); opacity: 0.2; }
  50% { transform: translateY(18px) rotate(-12deg); opacity: 0.9; }
}

.monolith-rise {
  display: flex;
  align-items: end;
  justify-content: center;
  gap: 0.7rem;
  padding: 2rem;
}
.monolith-rise .block {
  width: 2.2rem;
  height: 50%;
  border-radius: 0.7rem 0.7rem 0 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.34), rgba(255,255,255,0.08));
  box-shadow: inset 0 0 18px rgba(255,255,255,0.04);
  animation: monolithRaise 7s ease-in-out infinite;
}

@keyframes monolithRaise {
  0%, 100% { height: 28%; opacity: 0.18; }
  50% { height: 92%; opacity: 0.9; }
}

.luma-swarm {
  background: radial-gradient(circle at center, rgba(255,255,255,0.04), transparent 60%);
}
.luma-swarm .swarm-dot {
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 50%;
  background: rgba(255,255,255,0.8);
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) rotate(0deg) translateX(10rem);
  box-shadow: 0 0 16px rgba(255,255,255,0.28);
  animation: swarmSpin 7s linear infinite;
}

@keyframes swarmSpin {
  0% { transform: translate(-50%, -50%) rotate(0deg) translateX(10rem); }
  100% { transform: translate(-50%, -50%) rotate(360deg) translateX(10rem); }
}

.split-rows {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1rem;
  padding: 2rem;
}
.split-rows .row-line {
  width: 100%;
  height: 0.7rem;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(255,255,255,0.12), rgba(255,255,255,0.85), rgba(255,255,255,0.12));
  animation: splitSlide 5s ease-in-out infinite;
}

@keyframes splitSlide {
  0%, 100% { transform: scaleX(0.58) translateX(-10%); opacity: 0.2; }
  50% { transform: scaleX(1.04) translateX(8%); opacity: 0.92; }
}

.magnet-mesh {
  background: radial-gradient(circle at center, rgba(255,255,255,0.04), transparent 68%);
}
.magnet-mesh .mesh-ring {
  inset: 18%;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 50%;
  animation: meshRotate 7s linear infinite;
}
.magnet-mesh .node {
  width: 0.9rem;
  height: 0.9rem;
  border-radius: 50%;
  background: rgba(255,255,255,0.7);
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) rotate(0deg) translateX(10rem);
  animation: nodeOrbit 6s linear infinite;
}

@keyframes meshRotate {
  0% { transform: rotate(0deg) scale(0.9); opacity: 0.2; }
  50% { transform: rotate(180deg) scale(1.06); opacity: 0.9; }
  100% { transform: rotate(360deg) scale(0.9); opacity: 0.2; }
}
@keyframes nodeOrbit {
  0% { transform: translate(-50%, -50%) rotate(0deg) translateX(11rem); }
  100% { transform: translate(-50%, -50%) rotate(360deg) translateX(11rem); }
}

.slicer-sweep {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.35rem;
  padding: 1.5rem;
}
.slicer-sweep .slice {
  width: 1.2rem;
  height: 100%;
  border-radius: 1rem;
  background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.62));
  animation: sliceSweep 4.5s ease-in-out infinite;
}

@keyframes sliceSweep {
  0%, 100% { transform: skewX(-20deg) scaleY(0.7); opacity: 0.2; }
  50% { transform: skewX(12deg) scaleY(1.04); opacity: 0.9; }
}

.static-motes {
  background: radial-gradient(circle at center, rgba(255,255,255,0.06), transparent 70%);
}
.static-motes .mote {
  width: 0.38rem;
  height: 0.38rem;
  border-radius: 50%;
  background: rgba(255,255,255,0.8);
  left: calc(var(--x, 0) * 1%);
  top: calc(var(--y, 0) * 1%);
  animation: moteFloat 8s ease-in-out infinite;
}

@keyframes moteFloat {
  0%, 100% { transform: translate(0, 0) scale(0.8); opacity: 0.25; }
  50% { transform: translate(10px, -14px) scale(1.2); opacity: 0.9; }
}

.conic-spin {
  display: grid;
  place-items: center;
}
.conic-spin .cone {
  width: 14rem;
  height: 14rem;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.16);
  clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  animation: coneSpin 8s ease-in-out infinite;
}
.conic-spin .cone-1 { transform: rotate(0deg); }
.conic-spin .cone-2 { width: 11rem; height: 11rem; animation-delay: 0.6s; }
.conic-spin .cone-3 { width: 8rem; height: 8rem; animation-delay: 1.2s; }
.conic-spin .cone-ring {
  width: 18rem;
  height: 18rem;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 50%;
  animation: coneOrbit 8s linear infinite;
}

@keyframes coneSpin {
  0%, 100% { transform: rotate(0deg) scale(0.82); opacity: 0.2; }
  50% { transform: rotate(180deg) scale(1.08); opacity: 0.85; }
}
@keyframes coneOrbit {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.stagger-bars {
  display: flex;
  align-items: end;
  justify-content: center;
  gap: 0.5rem;
  padding: 2rem;
}
.stagger-bars .bar {
  width: 0.8rem;
  height: 35%;
  border-radius: 1rem 1rem 0 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.7), rgba(255,255,255,0.08));
  animation: barDrop 5s ease-in-out infinite;
}

@keyframes barDrop {
  0%, 100% { transform: scaleY(0.3); opacity: 0.15; }
  50% { transform: scaleY(1.06); opacity: 0.9; }
}

.thread-lace {
  background: radial-gradient(circle at center, rgba(255,255,255,0.03), transparent 65%);
}
.thread-lace .lace {
  left: 50%;
  top: 50%;
  width: 13rem;
  height: 13rem;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 42% 58% 60% 40% / 38% 36% 64% 62%;
  transform: translate(-50%, -50%);
  animation: laceMorph 8s ease-in-out infinite;
}
.thread-lace .lace-2 { width: 18rem; height: 18rem; animation-delay: 0.7s; }
.thread-lace .lace-3 { width: 10rem; height: 10rem; animation-delay: 1.3s; }
.thread-lace .lace-4 { width: 22rem; height: 22rem; animation-delay: 1.9s; }

@keyframes laceMorph {
  0%, 100% { transform: translate(-50%, -50%) rotate(0deg) scale(0.82); opacity: 0.18; }
  50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.06); opacity: 0.9; }
}

.mirage-bloom {
  background: radial-gradient(circle at center, rgba(255,255,255,0.06), transparent 60%);
}
.mirage-bloom .mirage {
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle at center, rgba(255,255,255,0.18), rgba(255,255,255,0.06) 42%, transparent 70%);
  filter: blur(8px);
  animation: mirageBloom 7s ease-in-out infinite;
}
.mirage-bloom .mirage-1 { width: 16rem; height: 16rem; }
.mirage-bloom .mirage-2 { width: 24rem; height: 24rem; animation-delay: 1.2s; }
.mirage-bloom .mirage-3 { width: 30rem; height: 30rem; animation-delay: 2.4s; }

@keyframes mirageBloom {
  0%, 100% { transform: translate(-50%, -50%) scale(0.7); opacity: 0.18; }
  50% { transform: translate(-50%, -50%) scale(1.08); opacity: 0.9; }
}

.depth-blocks {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.8rem;
  padding: 2rem;
}
.depth-blocks .depth-box {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 1rem;
  background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: inset 0 0 18px rgba(255,255,255,0.04);
  animation: depthMove 5s ease-in-out infinite;
}

@keyframes depthMove {
  0%, 100% { transform: perspective(600px) rotateX(0deg) rotateY(0deg) translateZ(0); opacity: 0.25; }
  50% { transform: perspective(600px) rotateX(18deg) rotateY(14deg) translateZ(12px); opacity: 0.92; }
}

.night-current {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.7rem;
  padding: 2rem;
}
.night-current .current-line {
  width: 100%;
  height: 0.75rem;
  border-radius: 999px;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.78) 40%, rgba(255,255,255,0.2) 100%);
  filter: blur(0.5px);
  animation: currentMove 6s ease-in-out infinite;
}

@keyframes currentMove {
  0%, 100% { transform: translateX(-8%) scaleX(0.7); opacity: 0.2; }
  50% { transform: translateX(8%) scaleX(1.06); opacity: 0.95; }
}

@media (max-width: 720px) {
  .scene-stage {
    padding: 0.8rem 0.8rem 5.2rem;
  }

  .hero-copy {
    top: 4.8rem;
    width: min(18rem, 74vw);
  }

  .description {
    max-width: 17rem;
  }

  .scene {
    width: min(82vw, 72vh);
    height: min(78vw, 72vh);
    margin-right: 0.25rem;
    margin-top: 7.5rem;
  }

  .nav-shell {
    right: 0.75rem;
    bottom: 0.75rem;
  }

  .nav-button {
    width: 3.1rem;
    height: 3.1rem;
  }

  .top-bar {
    gap: 0.5rem;
  }

  .eyebrow {
    padding: 0.3rem 0.54rem;
    letter-spacing: 0.12em;
    font-size: 0.55rem;
  }

  .counter {
    font-size: 0.58rem;
    letter-spacing: 0.12em;
  }
}
